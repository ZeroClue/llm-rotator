services:
  llm-rotator:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-rotator:latest
    container_name: llm-rotator
    restart: unless-stopped
    # The drain machinery needs to outlive every outer killer: gunicorn's
    # graceful timeout (30s default) bounds the worker wait, and this grace
    # must exceed IT so SIGKILL never lands mid-drain. Keep
    # STREAM_DRAIN_WINDOW < GUNICORN_GRACEFUL_TIMEOUT < stop_grace_period.
    stop_grace_period: 35s
    # Required: Tailscale's 100.64.x.x SOCKS5 endpoints are unreachable from
    # bridge networking. With host networking, PROXY_BIND_HOST=127.0.0.1 binds
    # the HOST's loopback.
    network_mode: host
    env_file:
      - .env
    environment:
      # The proxy has no built-in authentication: keep it on loopback unless
      # you front it with an authenticating reverse proxy.
      # NOTE: this overrides any PROXY_BIND_HOST from .env.
      PROXY_BIND_HOST: 127.0.0.1
      # PROXY_BIND_HOST: 0.0.0.0 exposes an UNAUTHENTICATED gateway on all host interfaces.
      # PROXY_BIND_PORT comes from .env (default 8080 inside gunicorn.conf.py).
    healthcheck:
      # Shell form so the port follows PROXY_BIND_PORT from .env instead of a
      # hardcoded 8080 ($$ escapes compose interpolation; resolved in-container).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,os; sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\\\"PROXY_BIND_PORT\\\", \\\"8080\\\")}/health', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
